name: Auto-bump pageVer

on:
  push:
    branches: [main]
    # This list MUST equal the keys of FILE_TO_PAGE in scripts/pre-commit-action.py.
    # A file mapped there but missing here never bumps, because this filter decides
    # whether the workflow runs at all — the script never gets to see the push.
    #
    # That is not hypothetical. On 2026-08-04 the CRM page gained a 14-step
    # interactive walkthrough (319b438); crm-supabase.html was mapped in the script
    # but absent from this list, so pageVer sat at 1.0 and the registry reported the
    # page "in sync" with its guide. 21 of 34 mapped files were in that state.
    #
    # Two hand-maintained lists drift, so a comment is not the control:
    # tests/constant-drift.test.js asserts this list equals FILE_TO_PAGE exactly and
    # fails the build if they diverge. Add a file to BOTH, or the test goes red.
    #
    # (os/index.html removed — Operating Systems Hub deleted Apr 2026.
    #  os/launch-plan.html removed — duplicated Strategy OS, deleted Apr 2026.
    #  os/business-plan-builder/index.html removed 2026-08-06 — retired from the
    #  shell 1 Aug 2026, has no PAGE_REGISTRY entry, so it triggered a no-op run.)
    paths:
      - 'ai-brain.html'
      - 'compliance.html'
      - 'crm-supabase.html'
      - 'follow-up.html'
      - 'how-it-works.html'
      - 'js/agent-accuracy.js'
      - 'js/ar-variable.js'
      - 'js/arrears.js'
      - 'js/cashflow.js'
      - 'js/ceo-brief.js'
      - 'js/cfv.js'
      - 'js/costs.js'
      - 'js/crm-walkthrough.js'
      - 'js/dashboard.js'
      - 'js/fintable.js'
      - 'js/income.js'
      - 'js/invoices.js'
      - 'js/kpi-library.js'
      - 'js/money.js'
      - 'js/pnl.js'
      - 'js/prospecting.js'
      - 'js/reconciliation.js'
      - 'js/sitemap.js'
      - 'js/skills-data.js'
      - 'js/skills.js'
      - 'js/transactions.js'
      - 'js/wealth-ratios.js'
      - 'js/wealth.js'
      - 'os/operations/index.html'
      - 'os/strategy/index.html'
      - 'os/strategy/strategy.css'
      - 'os/strategy/strategy.js'
      - 'os/systemisation/index.html'
      - 'os/tasks/index.html'
      - 'os/team/index.html'

permissions:
  contents: write  # needed so the job can push its auto-bump commit back to main

jobs:
  bump:
    runs-on: ubuntu-latest
    # Skip if this commit was made by the action itself (prevent infinite loop)
    if: "!contains(github.event.head_commit.message, '[auto-bump]')"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect changed pages and bump versions
        run: |
          python3 scripts/pre-commit-action.py
        env:
          GITHUB_BEFORE_SHA: ${{ github.event.before }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet js/config.js && exit 0
          git add js/config.js
          git commit -m "Auto-bump pageVer for modified pages [auto-bump]"
          # Retry-on-race: if another push landed on main while this workflow
          # was running, our push will be rejected as non-fast-forward. Pull
          # with rebase and retry once. (Caused a recurring "All jobs have
          # failed" email when Kevin pushed two commits within ~30s.)
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt rejected — pulling with rebase and retrying"
            git pull --rebase origin main || true
          done
          echo "Push failed after 3 attempts"
          exit 1

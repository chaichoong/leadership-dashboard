<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skills Library — Supabase</title>
<link rel="stylesheet" href="css/tokens.css?v=1">
<link rel="stylesheet" href="css/styles.css?v=23">
<!-- Supabase clone: supabase-js + shim + login gate (non-deferred so window.fetch
     is overridden before skills.js runs). Run-Skill (Claude proxy) passes through. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="skills-shim.js?v=2"></script>
<script src="skills-boot.js?v=1"></script>
<style>
  body { background: var(--bg-app); color: var(--text-primary); margin: 0; }
  .section { padding: 22px 26px; max-width: 1120px; margin: 0 auto; }
</style>
</head>
<body>
<!-- Globals skills.js (a strict-mode IIFE) reads from the global scope. Define
     them BEFORE loading skills.js. PAT is a dummy — the shim ignores it. -->
<script>
  var BASE_ID = 'appnqjDpqDniH3IRl';
  var PAT = 'supabase';
  function escHtml(str){ const d = document.createElement('div'); d.textContent = (str == null ? '' : str); return d.innerHTML; }
  function escJs(str){ if (str == null) return ''; return String(str).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"').replace(/\n/g,'\\n').replace(/\r/g,'\\r'); }
  function showToast(msg){ try { console.log('[toast]', msg); } catch (e) {} }
</script>

<!-- Skills Library markup (mirrors the #skills tab in index.html) -->
<div class="tab-panel" id="tab-skills" style="display:block">
  <div class="section">
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px">
      <div>
        <h2 class="section-title" style="margin-bottom:2px">Skills Library</h2>
        <p style="color:var(--text-secondary);font-size:13px;margin:0">All Claude Code and Cowork skills available in your setup. <span id="skillsTotalCount" style="font-weight:600"></span></p>
      </div>
      <div style="display:flex;gap:8px">
        <button onclick="expandAllSkills()" class="skills-toolbar-btn" title="Expand all">Expand All</button>
        <button onclick="collapseAllSkills()" class="skills-toolbar-btn" title="Collapse all">Collapse All</button>
      </div>
    </div>
    <div style="margin-bottom:16px;display:flex;gap:8px;align-items:center">
      <input type="text" id="skillsSearchInput" class="skills-search-input" placeholder="Search skills by name, keyword, or category..." oninput="onSkillsSearch(event)" aria-label="Search skills">
      <button type="button" class="od-clear-filters" onclick="clearSkillsFilters()" title="Reset search, source and category filters back to default">Clear filters</button>
    </div>
    <div class="skills-source-bar" id="skillsSourceBar" style="display:flex;gap:6px;margin-bottom:12px"></div>
    <div class="skills-filter-bar" id="skillsFilterBar"></div>
    <div id="skillsLibraryContent"></div>
  </div>
</div>

<script src="js/skills-data.js?v=6"></script>
<script src="js/skills.js?v=11"></script>
<script>
  // ── Client entitlement filter for the static skills catalogue ──────────────
  // The home org ("Operations Director Main") sees every skill. For a CLIENT:
  //   • hide the provider's bespoke skills (source custom / project / scheduled),
  //   • gate feature-specific categories to the modules the client actually has.
  // The client's OWN skills (sys_workflows, already org-scoped by RLS) are left
  // untouched. Fail-safe: any error leaves the catalogue filtered (client view).
  (function () {
    const OWNER_ONLY = ['custom', 'project', 'scheduled'];
    // Whole categories a base-plan business client never needs. "Development" is
    // software-engineering + Claude Code power-user tooling (PR review, security
    // review, API building, harness config) — no base module maps to it.
    const CLIENT_HIDE_CATEGORIES = ['Development'];
    // Individual preset skills hidden from clients:
    //  • cash-flow-forecast — still reads the provider's Airtable base (rebuild for Supabase first).
    //  • data-* — duplicate / analyst-grade data skills; base clients keep Data Analysis,
    //    Dashboard Builder and Data Visualisation only.
    //  • prod-* — internal productivity/memory plumbing, not a client "run a skill" action.
    const OWNER_ONLY_IDS = [
      'cash-flow-forecast',
      'data-write-query', 'data-sql-queries', 'data-explore',
      'data-validate', 'data-statistical', 'data-context-extractor', 'data-create-viz',
      'prod-memory', 'prod-start', 'prod-update',
    ];
    const CATEGORY_FEATURE = {          // skill category → the feature it requires
      'Property Management': 'property',
      'Finance':             'finance',
      'Marketing':           'content_machine',
      'Customer Support':    'inbound_comms',
    };
    const BASE   = ['strategy', 'tasks', 'team', 'systemisation', 'ai_assistant', 'dod_queue', 'crm'];
    const OPTOUT = ['plan_builder', 'command_centre'];
    async function isOwner(sb) {
      try {
        const { data, error } = await sb.from('organizations').select('id').eq('name', 'Operations Director Main').limit(1);
        return !error && !!(data && data.length);
      } catch (e) { return false; }
    }
    async function features(sb) {
      const en = new Set([...BASE, ...OPTOUT]);
      try {
        const { data } = await sb.from('org_modules').select('module_key, enabled');
        (data || []).forEach(r => { if (r.enabled) en.add(r.module_key); else if (OPTOUT.includes(r.module_key)) en.delete(r.module_key); });
      } catch (e) { /* base + opt-out features stay */ }
      return en;
    }
    window.__applySkillEntitlements = async function () {
      try {
        const sb = window.sbSkills && window.sbSkills();
        if (!sb || typeof SKILLS_LIBRARY === 'undefined') return;
        if (await isOwner(sb)) return;                    // provider sees everything
        window.__skillsClientView = true;                 // client → default to the full list below
        const feats = await features(sb);
        SKILLS_LIBRARY = SKILLS_LIBRARY.filter(s => {
          if (OWNER_ONLY.includes(s.source)) return false;               // provider's own skills
          if (CLIENT_HIDE_CATEGORIES.includes(s.category)) return false; // dev / power-user tooling
          if (OWNER_ONLY_IDS.includes(s.id)) return false;               // Airtable-linked / dupes / plumbing
          const need = CATEGORY_FEATURE[s.category];
          if (need && !feats.has(need)) return false;                    // feature the client doesn't have
          return true;
        });
      } catch (e) { console.warn('[skills] entitlement filter failed', e); }
    };
  })();

  // Wait for a real Supabase session, apply the client entitlement filter, then render.
  (window.ensureSbSession ? window.ensureSbSession() : Promise.resolve())
    .then(function () { return window.__applySkillEntitlements ? window.__applySkillEntitlements() : null; })
    .then(function () { if (typeof renderSkillsTab === 'function') return renderSkillsTab(); })
    .then(function () {
      // A client's "My Skills" is normally empty, so land them on the full list.
      if (!window.__skillsClientView) return;
      const pills = document.querySelectorAll('#skillsSourceBar .skills-source-pill');
      for (const p of pills) { if (/^All\b/.test((p.textContent || '').trim())) { p.click(); break; } }
    });
</script>
</body>
</html>
